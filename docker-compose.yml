version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - POSTGRES_DSN=host=db user=swiftlet password=swiftlet123 dbname=swiftlet sslmode=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=swiftlet
      - MQTT_BROKER=tcp://mosquitto:1883
      - JWT_SECRET=development-secret-change-in-production
      - AI_ENGINE_ENABLED=false
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - swiftlet-network

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: swiftlet
      POSTGRES_PASSWORD: swiftlet123
      POSTGRES_DB: swiftlet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U swiftlet" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftlet-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - swiftlet-network

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9002:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    networks:
      - swiftlet-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - swiftlet-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=swiftlet_admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - swiftlet-network

volumes:
  postgres_data:
  minio_data:
  mosquitto_data:
  prometheus_data:
  grafana_data:


networks:
  swiftlet-network:
    driver: bridge
