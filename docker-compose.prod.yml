# ===========================================
# Swiftlet Backend - Production (Dokploy)
# ===========================================
# Dokploy uses Traefik for reverse proxy & SSL
# Deploy via Dokploy UI or: docker-compose -f docker-compose.prod.yml up -d

services:
  # ===== Backend API =====
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "8080"
    environment:
      - ENV=production
      - PORT=8080
      - POSTGRES_DSN=postgres://swiftlet:${DB_PASSWORD}@db:5432/swiftlet?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-swiftlet}
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=https://storage.swiftlead.fuadfakhruz.com
      - MQTT_BROKER=tcp://mosquitto:1883
      - MQTT_CLIENT_ID=swiftlet-backend-prod
      - AI_ENGINE_URL=${AI_ENGINE_URL:-}
      - AI_ENGINE_ENABLED=${AI_ENGINE_ENABLED:-false}
      - CORS_ALLOWED_ORIGINS=https://swiftlead.fuadfakhruz.com
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.swiftlead.fuadfakhruz.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    networks:
      - dokploy-network

  # ===== PostgreSQL + TimescaleDB =====
  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      POSTGRES_USER: swiftlet
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: swiftlet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftlet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

  # ===== MinIO Object Storage =====
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    labels:
      # MinIO API (S3)
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`storage.swiftlead.fuadfakhruz.com`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      # MinIO Console
      - "traefik.http.routers.minio-console.rule=Host(`minio.swiftlead.fuadfakhruz.com`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    networks:
      - dokploy-network

  # ===== MQTT Broker =====
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: always
    ports:
      - "1883:1883" # MQTT TCP (expose directly, Traefik doesn't handle MQTT)
      - "8883:8883" # MQTT TLS
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - dokploy-network

  # ===== Prometheus =====
  prometheus:
    image: prom/prometheus:v2.48.0
    restart: always
    expose:
      - "9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`metrics.swiftlead.fuadfakhruz.com`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      # Basic auth middleware (optional - configure in Dokploy)
      # - "traefik.http.routers.prometheus.middlewares=prometheus-auth"
    networks:
      - dokploy-network

  # ===== Grafana =====
  grafana:
    image: grafana/grafana:10.2.0
    restart: always
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://monitoring.swiftlead.fuadfakhruz.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitoring.swiftlead.fuadfakhruz.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks:
      - dokploy-network

volumes:
  postgres_data:
  minio_data:
  mosquitto_data:
  prometheus_data:
  grafana_data:

networks:
  dokploy-network:
    external: true
